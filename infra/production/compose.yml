# Production et préproduction de Vysora (OPS-01, ADR-0008) : Caddy (HTTPS automatique), site, API,
# PostgreSQL. Les secrets viennent de infra/production/.env (copie de .env.example, jamais commitée).
#   docker compose -f infra/production/compose.yml --env-file infra/production/.env up -d --build
# La procédure complète est dans docs/deploiement.md.
name: vysora-production

x-environnement-api: &environnement-api
  NODE_ENV: production
  ENVIRONNEMENT: ${ENVIRONNEMENT:-production}
  MOT_DE_PASSE_DEMO: ${MOT_DE_PASSE_DEMO:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SITE_URL: https://${DOMAINE}
  ORIGINES_AUTORISEES: https://${DOMAINE}
  DATABASE_URL: postgres://vysora:${POSTGRES_MOT_DE_PASSE}@postgres:5432/vysora
  SMTP_URL: ${SMTP_URL}
  EMAIL_EXPEDITEUR: ${EMAIL_EXPEDITEUR}
  EMAIL_EQUIPE: ${EMAIL_EQUIPE}
  SEL_EMPREINTES: ${SEL_EMPREINTES}
  CLE_CHIFFREMENT: ${CLE_CHIFFREMENT}
  STOCKAGE_DOSSIER: /donnees/stockage
  VERIFIER_FUITES: ${VERIFIER_FUITES:-true}
  INSCRIPTION_SUR_INVITATION: ${INSCRIPTION_SUR_INVITATION:-true}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vysora
      POSTGRES_PASSWORD: ${POSTGRES_MOT_DE_PASSE:?POSTGRES_MOT_DE_PASSE est obligatoire}
      POSTGRES_DB: vysora
    volumes:
      # Depuis PostgreSQL 18, l'image range les données dans /var/lib/postgresql/<version>/docker
      - postgres-donnees:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vysora -d vysora']
      interval: 5s
      timeout: 5s
      retries: 20

  # Migrations puis référentiels, avant chaque démarrage de l'API (idempotents).
  migration:
    build: { context: ../.., target: api }
    image: vysora-api
    environment: *environnement-api
    command: ['sh', '-c', 'node dist/db/migrer.js && node dist/db/seed/index.js']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    image: vysora-api
    restart: unless-stopped
    environment: *environnement-api
    volumes:
      - stockage:/donnees/stockage
    depends_on:
      migration: { condition: service_completed_successfully }
    # L'API finit les tâches de la file en cours avant de s'arrêter (EMAIL-01).
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../..
      target: web
      args:
        SITE_URL: https://${DOMAINE:?DOMAINE est obligatoire}
    image: vysora-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SITE_URL: https://${DOMAINE}
      API_URL_INTERNE: http://api:3000
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAINE: ${DOMAINE}
      EMAIL_CERTIFICATS: ${EMAIL_CERTIFICATS:?EMAIL_CERTIFICATS est obligatoire}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-donnees:/data
      - caddy-configuration:/config
    depends_on:
      - web
      - api

volumes:
  postgres-donnees:
  stockage:
  caddy-donnees:
  caddy-configuration:
