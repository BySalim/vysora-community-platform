name: Vérification

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vysora
          POSTGRES_PASSWORD: vysora
          POSTGRES_DB: vysora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vysora -d vysora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://vysora:vysora@localhost:5432/vysora_test
      DATABASE_URL_TEST: postgres://vysora:vysora@localhost:5432/vysora_test
      # Valeurs propres à la CI, sans rapport avec la production.
      SEL_EMPREINTES: ci-sel-des-empreintes-de-test
      CLE_CHIFFREMENT: Y2ktY2xlLWRlLWNoaWZmcmVtZW50LTMyLW9jdGV0cyE

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
