# Images de production (OPS-01) : construites par GitHub après chaque vérification réussie de main,
# publiées dans le registre du dépôt (ghcr.io). Le serveur n'a plus qu'à les télécharger
# (docker compose pull), sans rien installer ni compiler : une petite machine suffit.
# Réglage du dépôt nécessaire : variable DOMAINE (Settings › Secrets and variables › Actions › Variables),
# le nom de domaine public sans https://, gravé dans l'image du site (liens absolus, canonique).
name: Images

on:
  workflow_run:
    workflows: [Vérification]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: true

jobs:
  publier:
    name: Construction et publication des images
    # Seulement après une vérification réussie de main (ou à la demande depuis main).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Réglages
        id: reglages
        env:
          DOMAINE: ${{ vars.DOMAINE }}
        run: |
          if [ -z "$DOMAINE" ]; then
            echo "::error::La variable DOMAINE du dépôt n'est pas définie (Settings › Secrets and variables › Actions › Variables)."
            exit 1
          fi
          # ghcr.io n'accepte que des noms en minuscules.
          echo "registre=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          # Le commit vérifié, pas un éventuel commit arrivé entre-temps.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image de l'API
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ steps.reglages.outputs.registre }}/vysora-api:latest
            ${{ steps.reglages.outputs.registre }}/vysora-api:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=vysora
          cache-to: type=gha,scope=vysora,mode=max

      - name: Image du site
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          build-args: SITE_URL=https://${{ vars.DOMAINE }}
          tags: |
            ${{ steps.reglages.outputs.registre }}/vysora-web:latest
            ${{ steps.reglages.outputs.registre }}/vysora-web:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=vysora
          cache-to: type=gha,scope=vysora,mode=max
