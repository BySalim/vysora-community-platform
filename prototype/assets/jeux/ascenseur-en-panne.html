<script>
'use strict';
(() => {
const cv = document.getElementById('jeu');
const ctx = cv.getContext('2d');
const F = 'system-ui, sans-serif';
const VH = 540, COLW = 420, FH = 1000, NF = 12;
const G = 1500, BOUNCE = 760, CAFE_V = 1400, MAXVX = 380, ACC = 2700, FRIC = 2600, STEP = 1 / 120;
const AFLOOR = -NF * FH, ACAM = AFLOOR - 505, TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const R = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
const fr = s => s.replace(/(\d) h (\d)/g, '$1 h $2').replace(/ ([?!;])/g, ' $1').replace(/ ([:»])/g, ' $1').replace(/« /g, '« ');
const hex = c => { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };

const NOMS = ['Accueil', 'Comptabilité', 'Ressources humaines', 'Marketing', 'Open space', 'Service client', 'Juridique', 'Design', 'Recette', 'Data', 'Produit', 'Direction', 'Salle des serveurs'];
const MURS = ['#f4ebdd', '#e7f0e4', '#f7e5e0', '#e3ebf6', '#f5efd8', '#ece4f4', '#e0efed', '#f6e7d4', '#e6ebdc', '#f1e2ea', '#e2e7f4', '#f2e4d6'];
const BLAGUES = [
	'Le vendredi, on ne déploie pas. On prie, puis on déploie.',
	'J’ai corrigé un bug. Ses deux cousins sont venus au pot de départ.',
	'Ma variable s’appelle « temporaire ». Elle fête ses cinq ans.',
	'Ce n’est pas une boucle infinie. C’est un engagement à long terme.',
	'Estimation : deux heures. Réalité : deux heures, trois jours.',
	'99 tests passent. Le centième a pris son vendredi.',
	'La documentation ? Tout le monde en parle, personne ne l’a vue.',
	'Un développeur ne vieillit pas : il change de version majeure.',
	'Le point-virgule manquant n’est pas perdu. Il est en télétravail.',
	'Mon code compile du premier coup. Je commence à m’inquiéter.',
	'Réunion de 17 h 30 : « On va faire court. » Il est 17 h 45.',
	'Le stagiaire a poussé sur main. Main a poussé un cri.',
	'Le meilleur moment pour déployer, c’était hier. Le deuxième, c’est lundi.',
	'Pas de bug en production : juste des tests grandeur nature.',
	'Le cache garde tout. Sauf ce dont vous avez besoin.',
	'Un commentaire dit : « Ne pas toucher. » Personne ne sait pourquoi.'
].map(fr);
const DEUX_MIN = ['', 'Juste deux minutes pour ta note de frais ?', 'Juste deux minutes pour ton entretien annuel ?', 'Juste deux minutes, un petit remue-méninges ?', 'Juste deux minutes, je partage mon écran ?', 'Juste deux minutes, j’ai un client en ligne ?', 'Juste deux minutes pour relire un contrat ?', 'Juste deux minutes : plus de bleu, ou moins ?', 'Juste deux minutes, j’ai un bug « bizarre » ?', 'Juste deux minutes, un petit tableau croisé ?', 'Juste deux minutes pour une toute petite fonctionnalité ?', 'Juste deux minutes pour la feuille de route ?'].map(fr);
const LIBERE = ['Bon, je t’envoie un mail.', 'On cale ça lundi ?', 'Je te mets une invitation !', 'Ah, tu pars ? Bon week-end !', 'Je reviens vers toi.'].map(fr);
const ETIQ = ['BUG', 'URGENT', 'P1', '#404', 'HOTFIX', 'TODO', 'ASAP'];
const AFFICHES = ['Pas de mise en prod le vendredi', 'Avez-vous écrit les tests ?', 'Ici, on boit du café', 'Objectif : zéro bug', 'Sauvegardez souvent', 'Revue de code à 9 h', 'Respirez. Ça va compiler.'].map(fr);
const ASTUCES = ['', 'Attention aux tickets qui tombent du plafond !', 'Évitez les collègues qui veulent « juste deux minutes ».', 'Les plantes vertes sont glissantes.', 'Les bureaux à roulettes bougent.', 'Les cartons d’archives cèdent sous vos pieds.'].map(fr);
const ordinal = n => n <= 0 ? 'Rez-de-chaussée' : n === 1 ? '1er étage' : n + 'e étage';

// Sons synthétisés
let AC = null, master = null, muet = false, bruit = null;
const VOL = 0.32;
function audio() {
	if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
	try {
		AC = new (window.AudioContext || window.webkitAudioContext)();
		master = AC.createGain(); master.gain.value = muet ? 0 : VOL; master.connect(AC.destination);
		bruit = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
		const d = bruit.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
	} catch (e) { AC = null; }
}
function tone(f, d, type, v, slide, delay) {
	if (!AC || muet) return;
	const t = AC.currentTime + Math.max(0, delay || 0), o = AC.createOscillator(), g = AC.createGain();
	o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
	if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
	g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
	o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);
}
function souffle(d, v, f, delay) {
	if (!AC || muet) return;
	const t = AC.currentTime + (delay || 0), s = AC.createBufferSource(), b = AC.createBiquadFilter(), g = AC.createGain();
	s.buffer = bruit; b.type = 'bandpass'; b.frequency.value = f; b.Q.value = 0.9;
	g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
	s.connect(b); b.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.05);
}
const SFX = {
	rebond: () => tone(330 + Math.random() * 40, 0.13, 'sine', 0.14, 260),
	cafe: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.16, 0, i * 0.06)); souffle(0.4, 0.08, 2500); },
	ticket: () => { souffle(0.22, 0.28, 900); tone(200, 0.2, 'square', 0.05, -90); },
	saisi: () => { tone(260, 0.22, 'triangle', 0.16, -70); tone(196, 0.3, 'triangle', 0.13, -40, 0.13); },
	libre: () => tone(440, 0.14, 'sine', 0.16, 420),
	glisse: () => tone(900, 0.3, 'sine', 0.1, -640),
	carton: () => { souffle(0.2, 0.3, 450); tone(140, 0.12, 'square', 0.04, -50); },
	etage: () => { tone(659, 0.2, 'triangle', 0.15); tone(988, 0.34, 'triangle', 0.13, 0, 0.12); },
	alerte: () => { tone(880, 0.07, 'square', 0.045); tone(880, 0.07, 'square', 0.045, 0, 0.15); },
	vroum: () => souffle(0.6, 0.16, 1400),
	siffle: () => tone(1400, 0.5, 'sine', 0.08, -1000),
	boum: () => { tone(90, 0.35, 'sine', 0.3, -40); souffle(0.25, 0.2, 300); },
	esquive: () => { tone(784, 0.12, 'triangle', 0.16); tone(1175, 0.24, 'triangle', 0.16, 0, 0.09); },
	ouvre: () => [523, 784, 1047, 1568].forEach((f, i) => tone(f, 0.22, 'sine', 0.13, 0, i * 0.08)),
	refus: () => tone(180, 0.18, 'square', 0.05, -30),
	bip: () => tone(1320, 0.05, 'sine', 0.07),
	victoire: () => [523, 659, 784, 1047, 880, 1047, 1319].forEach((f, i) => tone(f, i === 6 ? 0.6 : 0.2, 'triangle', 0.16, 0, i * 0.11)),
	perdu: () => [392, 349, 311, 262].forEach((f, i) => tone(f, 0.3, 'triangle', 0.15, -10, i * 0.17)),
	depart: () => { tone(523, 0.12, 'triangle', 0.14); tone(784, 0.2, 'triangle', 0.14, 0, 0.1); }
};
// Petite boucle musicale douce (do, la mineur, fa, sol)
let musT = 0, musI = 0;
const PROG = [[48, 55, 60, 64], [45, 52, 57, 60], [41, 48, 53, 57], [43, 50, 55, 59]];
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function musique(vite) {
	if (!AC || muet || AC.state !== 'running') return;
	const spb = vite ? 0.16 : 0.2;
	if (musT < AC.currentTime) musT = AC.currentTime + 0.05;
	while (musT < AC.currentTime + 0.25) {
		const ch = PROG[Math.floor(musI / 8) % 4], s = musI % 8, dl = musT - AC.currentTime;
		if (s === 0 || s === 4) tone(mf(ch[0]), spb * 1.8, 'triangle', 0.07, 0, dl);
		if (s % 2 === 0 || vite) tone(mf(ch[[1, 2, 3, 2, 1, 3, 2, 3][s]] + 12), spb * 0.9, 'sine', 0.028, 0, dl);
		musT += spb; musI++;
	}
}

// Écran
let W = 960, H = 540, dpr = 1, sc = 1, vw = 960, oy = 0, colX = 270, compact = false;
function resize() {
	W = innerWidth || 960; H = innerHeight || 540; dpr = Math.min(window.devicePixelRatio || 1, 3);
	cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
	sc = H / VH; vw = W / sc; oy = 0;
	if (vw < 470) { sc = W / 470; vw = 470; oy = (H / sc - VH) / 2; }
	colX = Math.round((vw - COLW) / 2); compact = vw < 880;
}
addEventListener('resize', resize); resize();

// Commandes
let etat = 'titre';
const kb = { g: false, d: false, last: 0 };
const doigts = new Map();
let dernierDoigt = null;
function dirEntree() {
	if (kb.g && kb.d) return kb.last;
	if (kb.g) return -1;
	if (kb.d) return 1;
	if (doigts.size) return doigts.has(dernierDoigt) ? doigts.get(dernierDoigt) : [...doigts.values()].pop();
	return 0;
}
function appuiDir(d) { if (etat === 'jeu' && P.tenu && d !== P.dernEsc) { P.dernEsc = d; P.esc++; P.gig = 0.14; SFX.bip(); } }
const estG = k => k === 'ArrowLeft' || k === 'a' || k === 'A' || k === 'q' || k === 'Q';
const estD = k => k === 'ArrowRight' || k === 'd' || k === 'D';
addEventListener('keydown', e => {
	const k = e.key;
	if (k === ' ' || k === 'Spacebar' || k.indexOf('Arrow') === 0) e.preventDefault();
	audio();
	if (estG(k) || estD(k)) {
		if (estG(k)) kb.g = true; else kb.d = true;
		kb.last = estG(k) ? -1 : 1;
		if (!e.repeat) appuiDir(kb.last);
	}
	if (e.repeat) return;
	if (k === 'm' || k === 'M') { basculerSon(); return; }
	if (k === 'p' || k === 'P' || k === 'Escape') { if (etat === 'jeu') pause(); else if (etat === 'pause') reprendre(); return; }
	if (k === 'r' || k === 'R') { nouvellePartie(); return; }
	if (etat === 'titre') nouvellePartie();
	else if (etat === 'pause' && (k === ' ' || k === 'Enter')) reprendre();
	else if ((etat === 'perdu' || etat === 'gagne') && finT > 0.9 && (k === ' ' || k === 'Enter')) nouvellePartie();
});
addEventListener('keyup', e => { if (estG(e.key)) kb.g = false; if (estD(e.key)) kb.d = false; });
function versLogique(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * vw, y: (e.clientY - r.top) / r.height * (VH + 2 * oy) - oy, cote: e.clientX - r.left < r.width / 2 ? -1 : 1 }; }
const BOUTONS = () => ({ son: { x: vw - 34, y: 30 }, pause: { x: vw - 80, y: 30 } });
const surBouton = (p, b) => Math.hypot(p.x - b.x, p.y - b.y) < 24;
cv.addEventListener('pointerdown', e => {
	e.preventDefault(); audio();
	try { cv.setPointerCapture(e.pointerId); window.focus(); cv.focus({ preventScroll: true }); } catch (_) { /* rien */ }
	const p = versLogique(e), b = BOUTONS();
	if (surBouton(p, b.son)) { basculerSon(); return; }
	if (etat === 'titre') { nouvellePartie(); return; }
	if (etat === 'pause') { reprendre(); return; }
	if (etat === 'perdu' || etat === 'gagne') { if (finT > 0.9) nouvellePartie(); return; }
	if (surBouton(p, b.pause)) { pause(); return; }
	doigts.set(e.pointerId, p.cote); dernierDoigt = e.pointerId; appuiDir(p.cote);
});
cv.addEventListener('pointermove', e => {
	if (!doigts.has(e.pointerId)) return;
	const c = versLogique(e).cote;
	if (c !== doigts.get(e.pointerId)) { doigts.set(e.pointerId, c); dernierDoigt = e.pointerId; appuiDir(c); }
});
const lever = e => { doigts.delete(e.pointerId); };
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => cv.addEventListener(n, lever));
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && etat === 'jeu') pause(); });
addEventListener('blur', () => { kb.g = kb.d = false; doigts.clear(); if (etat === 'jeu') pause(); });
let toastSon = 0;
function basculerSon() {
	muet = !muet; toastSon = 1.4;
	if (master && AC) master.gain.setTargetAtTime(muet ? 0 : VOL, AC.currentTime, 0.02);
}
function pause() { etat = 'pause'; kb.g = kb.d = false; doigts.clear(); }
function reprendre() { etat = 'jeu'; dernier = performance.now(); cumul = 0; }

// Niveau
let plats = [], cafes = [], collegues = [], decor = [], tickets = [], alertes = [], parts = [], flottes = [];
function plat(type, x, y, w) {
	const p = { type, x, y, w, vx: 0, casse: false, t: 0, deco: Math.floor(Math.random() * 6), livres: [] };
	if (type === 'etagere') { let bx = 6; while (bx < Math.min(w * 0.55, 60)) { const lw = R(5, 8); p.livres.push([bx, lw, R(12, 19), pick(['#e07a5f', '#3d85c6', '#81b29a', '#f2cc8f', '#9b72cf'])]); bx += lw + 1; } }
	plats.push(p); return p;
}
const LOOKS = [['#f28f6b', '#5a4a42', '#7a4e2d', 0], ['#7bc6a4', '#3b3f55', '#2f2a3a', 1], ['#f6c85f', '#4e5a7e', '#c0563a', 2], ['#c49bdb', '#384152', '#e2c9a0', 3], ['#e86f7d', '#2f3a4f', '#3a2c28', 2], ['#8fb3e8', '#5b4636', '#9a9aa5', 3]];
const PEAUX = ['#f1c6a0', '#d9a07a', '#a8714f', '#f4d2b8', '#7f5539'];
function genNiveau() {
	plats = []; cafes = []; collegues = []; decor = []; tickets = []; alertes = []; parts = []; flottes = [];
	plat('sol', 0, 0, COLW);
	decor.push({ k: 'ascenseur', x: 22, y: -178, w: 112, h: 178 });
	decor.push({ k: 'accueil', x: 286, y: -62, w: 118, h: 62 });
	for (let f = 0; f < NF; f++) {
		const base = -f * FH, slots = f === 0 ? [base - 560, base - 820] : [base - 260, base - 560, base - 830];
		for (const sy of slots) {
			const k = pick(['fenetre', 'fenetre', 'tableau', 'affiche', 'horloge', 'cadre']);
			const w = k === 'fenetre' ? R(120, 150) : k === 'tableau' ? 120 : k === 'affiche' ? 86 : k === 'horloge' ? 50 : 70;
			const h = k === 'fenetre' ? 140 : k === 'tableau' ? 80 : k === 'affiche' ? 110 : k === 'horloge' ? 50 : 56;
			decor.push({ k, x: R(16, COLW - w - 16), y: sy + R(-40, 40), w, h, v: pick(AFFICHES), n: Math.floor(Math.random() * 4) });
		}
	}
	const cafesY = [];
	for (let f = 0; f < NF; f++) { cafesY.push(-f * FH - R(380, 720)); if (f >= 4 && Math.random() < 0.6) cafesY.push(-f * FH - R(820, 960)); }
	cafesY.sort((a, b) => b - a);
	let y = -55, der = 'sol', colY = 1e9, ci = 0;
	for (;;) {
		const f0 = Math.floor(-y / FH), d0 = clamp((f0 - 1) / 10, 0, 1);

		let w = fl === 0 ? R(125, 150) : R(118 - d * 36, 140 - d * 40), type = 'bureau';
		const r = Math.random(); let acc = 0;
		const pr = p => (acc += p, r < acc);

		else if (pr(0.22)) type = 'armoire';

			colY = y;
		}
		if (type !== 'roulettes' && y < -230 && Math.random() < 0.55 - d * 0.25) {
			let w2 = R(80, 110), t2 = 'bureau';

			if (fl >= 5 && r2 < 0.42) t2 = 'carton'; else if (fl >= 3 && r2 < 0.62) t2 = 'plante'; else if (r2 < 0.8) t2 = 'etagere';

}

// État de la partie
const P = { x: 250, y: 0, vx: 0, vy: -600, face: 1, sq: 0, sqv: 0, t: 0, glisse: 0, etourdi: 0, immun: 0, tenu: null, esc: 0, dernEsc: 0, gig: 0, vrille: 0, holdT: 0, solY: 0, cote: 1 };
let mode = 'monte', camY = -430, temps = 0, penal = 0, finT = 0, secousse = 0, etageMax = 0, panneau = null, banniere = null;
let nbCafe = 0, nbTicket = 0, nbDeux = 0, record = null, nouveauRecord = false, tTicket = 4, B = null, consoleOuverte = false, deploiT = 0, refusT = 0, titreT = 0, mortMsg = '', blagues = [], heureFin = '';
const SEC0 = 17 * 3600 + 45 * 60;
const heureSec = () => SEC0 + temps * 6 + penal;
function heureTxt(s) { if (s === undefined) s = heureSec(); return Math.floor(s / 3600) % 24 + ' h ' + String(Math.floor(s / 60) % 60).padStart(2, '0'); }
function dureeTxt(t) { t = Math.floor(t * 10) / 10; const m = Math.floor(t / 60), s = t - m * 60; return (m ? m + ' min ' : '') + (m && s < 10 ? '0' : '') + s.toFixed(1).replace('.', ',') + ' s'; }

function nouvellePartie() {
	audio(); genNiveau();
	Object.assign(P, { x: COLW / 2, y: 0, vx: 0, vy: -BOUNCE, face: 1, sq: -0.3, sqv: 0, glisse: 0, etourdi: 0, immun: 0, tenu: null, esc: 0, dernEsc: 0, gig: 0, vrille: 0, holdT: 0, solY: 0, t: 0 });
	mode = 'monte'; camY = -430; temps = 0; penal = 0; finT = 0; secousse = 0; etageMax = 0; nbCafe = nbTicket = nbDeux = 0;
	tTicket = 3.5; B = null; consoleOuverte = false; deploiT = 0; refusT = 0; nouveauRecord = false;
	blagues = BLAGUES.slice().sort(() => Math.random() - 0.5);

function boutons() {
	const b = BOUTONS();

		if (n === 'pause') { ctx.fillRect(p.x - 6, p.y - 7, 4, 14); ctx.fillRect(p.x + 2, p.y - 7, 4, 14); continue; }
		ctx.beginPath(); ctx.moveTo(p.x - 9, p.y - 4); ctx.lineTo(p.x - 5, p.y - 4); ctx.lineTo(p.x, p.y - 9); ctx.lineTo(p.x, p.y + 9); ctx.lineTo(p.x - 5, p.y + 4); ctx.lineTo(p.x - 9, p.y + 4); ctx.fill();

function dessiner() {

// Boucle
genNiveau();
let dernier = performance.now(), cumul = 0;
function boucle(now) {
	requestAnimationFrame(boucle);
	const dt = clamp((now - dernier) / 1000, 0, 0.1); dernier = now;
	titreT += dt; toastSon = Math.max(0, toastSon - dt);
	if (etat !== 'pause') {
		cumul += dt; let n = 0;
		while (cumul >= STEP && n < 14) { maj(STEP); cumul -= STEP; n++; }
		if (n >= 14) cumul = 0;
	}
	if (etat === 'jeu') musique(mode !== 'monte');
	dessiner();
