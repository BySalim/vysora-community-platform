ctx.imageSmoothingEnabled = false;

function redim() {
  const vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
  const s = Math.min(vw / W, vh / H);
  const cw = Math.max(1, Math.floor(W * s)), ch = Math.max(1, Math.floor(H * s));
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  ecran.style.width = cw + 'px'; ecran.style.height = ch + 'px';
  ecran.width = Math.max(1, Math.round(cw * dpr)); ecran.height = Math.max(1, Math.round(ch * dpr));
}
window.addEventListener('resize', redim); redim();
function presenter() {
  const lisse = ecran.width < W;
  dctx.imageSmoothingEnabled = lisse;
  if (lisse) dctx.imageSmoothingQuality = 'high';
  dctx.drawImage(buf, 0, 0, ecran.width, ecran.height);
}

/* ---------- Outils ---------- */

function rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function melange(a, b, t) { const A = rgb(a), B = rgb(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',') + ')'; }
function chevauche(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

/* ---------- Police pixel 5 x 7 ---------- */
const POLICE = {};

  T: '11111|00100|00100|00100|00100|00100|00100', F: '11111|10000|10000|11110|10000|10000|10000',
  I: '01110|00100|00100|00100|00100|00100|01110', X: '10001|10001|01010|00100|01010|10001|10001',
  E: '11111|10000|10000|11110|10000|10000|11111', R: '11110|10001|10001|11110|10100|10010|10001',

  0: '01110|10001|10011|10101|11001|10001|01110', 1: '00100|01100|00100|00100|00100|00100|01110',
  2: '01110|10001|00001|00010|00100|01000|11111', 3: '11110|00001|00001|01110|00001|00001|11110',

  h: '10000|10000|10110|11001|10001|10001|10001'

function pixelTexte(s, x, y, e, coul, o) {
  o = o || {};
  const larg = s.length * 6 * e - e;
  const x0 = Math.round(o.align === 'left' ? x : o.align === 'right' ? x - larg : x - larg / 2), y0 = Math.round(y);
  const passe = (dy, c, m) => {
    for (let i = 0; i < s.length; i++) {
      const gl = POLICE[s[i]]; if (!gl) continue;
      const vy = o.vague ? Math.round(Math.sin(tReel * 3 + i * 0.7) * o.vague) : 0;
      for (let r = 0; r < 7; r++) {
        ctx.fillStyle = typeof c === 'string' ? c : c[r];
        for (let k = 0; k < 5; k++) if (gl[r][k] === '1') ctx.fillRect(x0 + (i * 6 + k) * e - m, y0 + r * e + dy + vy - m, e + 2 * m, e + 2 * m);
      }
    }
  };
  if (o.ombre) passe(o.decal || e, o.ombre, o.m || 0);
  if (o.contour) passe(0, o.contour, o.m || Math.max(1, e >> 1));
  passe(0, coul, 0);
}
function texte(s, x, y, t, c, al, ombre) {
  ctx.font = 'bold ' + t + 'px monospace'; ctx.textAlign = al || 'center'; ctx.textBaseline = 'middle';
  s = fr(s);
  if (ombre !== false) { ctx.fillStyle = 'rgba(14,8,30,0.92)'; ctx.fillText(s, x + 2, y + 2); }
  ctx.fillStyle = c; ctx.fillText(s, x, y);
}
function couper(s, max, t) {
  ctx.font = 'bold ' + t + 'px monospace';
  const mots = fr(s).split(' '), lignes = []; let l = '';
  for (const m of mots) { const essai = l ? l + ' ' + m : m; if (ctx.measureText(essai).width > max && l) { lignes.push(l); l = m; } else l = essai; }
  if (l) lignes.push(l);
  return lignes;
}

/* ---------- Son (Web Audio, créé après la première action) ---------- */

  init() {

    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; return; }

    this.bus = c.createGain(); this.bus.gain.value = 0.42; this.bus.connect(this.maitre);

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  },
  bip(f, dur, type, vol, glisse, delai) { if (!this.ctx) return; this.note(this.ctx.currentTime + (delai || 0), f, dur, type || 'square', vol || 0.3, glisse); },
  souffle(dur, vol, freq, delai, type, sortie, t0) {

    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  },
  saut() { this.bip(330, 0.14, 'square', 0.22, 660); },
  doubleSaut() { this.bip(520, 0.15, 'square', 0.2, 1100); this.bip(780, 0.12, 'triangle', 0.2, 1560, 0.05); },
  glisse() { this.souffle(0.22, 0.22, 900); },
  cafe() { this.bip(880, 0.07, 'square', 0.16); this.bip(1320, 0.11, 'square', 0.16, 0, 0.06); },
  cafeine() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.bip(f, 0.12, 'square', 0.17, 0, i * 0.06)); },
  aie() { this.bip(240, 0.28, 'sawtooth', 0.26, 70); this.souffle(0.18, 0.28, 2200); },
  quart() { this.bip(1046, 0.9, 'sine', 0.28); this.bip(1568, 0.8, 'sine', 0.14, 0, 0.02); this.bip(784, 1.1, 'sine', 0.2, 0, 0.35); },
  tir() { this.bip(200, 0.12, 'square', 0.16, 90); },
  boom() { this.souffle(0.6, 0.45, 500); this.bip(95, 0.5, 'sine', 0.45, 40); },
  victoire() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.bip(f, i === 6 ? 0.6 : 0.14, 'square', 0.18, 0, i * 0.12)); },
  defaite() { [392, 370, 349, 294].forEach((f, i) => this.bip(f, i === 3 ? 0.7 : 0.26, 'sawtooth', 0.16, i === 3 ? 220 : 0, i * 0.3)); },
  rate() { this.bip(300, 0.15, 'triangle', 0.2, 200); },
  MEL: [7, null, 12, null, 10, 7, null, 5, 3, null, 5, 7, null, 3, 0, null, -2, null, 3, null, 7, 10, null, 7, 5, null, 2, null, 5, 7, 10, null],
  BAS: [0, -4, 3, -2],
  MELB: [0, 3, 7, 12, 7, 3, 0, 3, 0, 3, 7, 12, 15, 12, 7, 3, -4, 0, 3, 8, 3, 0, -4, 0, -5, -1, 2, 7, 11, 7, 2, -1],
  BASB: [0, 0, -4, -5],
  lancerMusique(mode) { this.musique = true; this.mode = mode; this.pas = 0; if (this.ctx) this.prochain = this.ctx.currentTime + 0.12; },
  arreterMusique() { this.musique = false; },
  majMusique(tempo) {
    if (!this.ctx || !this.musique || this.ctx.state !== 'running') return;
    const c = this.ctx, dur = 30 / tempo, boss = this.mode === 1;
    if (this.prochain < c.currentTime) this.prochain = c.currentTime + 0.05;
    while (this.prochain < c.currentTime + 0.3) {
      const t = this.prochain, i = this.pas % 32;
      const mel = boss ? this.MELB : this.MEL, bas = boss ? this.BASB : this.BAS;
      this.note(t, 110 * Math.pow(2, bas[i >> 3] / 12) * (i % 2 ? 2 : 1), dur * 0.9, 'triangle', 0.5, 0, this.bus);

/* ---------- Sprites pixel art (dessinés en code, contour automatique) ---------- */
function sprite(w, h, dessin, contour) {
  const c = toile(w + 2, h + 2), g = c.getContext('2d');
  dessin((col, x, y, ww, hh) => { g.fillStyle = col; g.fillRect(x + 1, y + 1, ww || 1, hh || 1); });
  const d = g.getImageData(0, 0, w + 2, h + 2), p = d.data, o = new Uint8ClampedArray(p), [r, gg, b] = rgb(contour || '#160f2a');
  const plein = (x, y) => x >= 0 && y >= 0 && x < w + 2 && y < h + 2 && p[(y * (w + 2) + x) * 4 + 3] > 0;
  for (let y = 0; y < h + 2; y++) for (let x = 0; x < w + 2; x++) {
    const i = (y * (w + 2) + x) * 4;
    if (!p[i + 3] && (plein(x - 1, y) || plein(x + 1, y) || plein(x, y - 1) || plein(x, y + 1))) { o[i] = r; o[i + 1] = gg; o[i + 2] = b; o[i + 3] = 255; }
  }
  d.data.set(o); g.putImageData(d, 0, 0);
  return c;
}
function agrandir(c, s) { s = s || S; const d = toile(c.width * s, c.height * s), g = d.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(c, 0, 0, d.width, d.height); return d; }

function trait(px, col, x0, y0, x1, y1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) px(col, Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), 2, 2);
}
function masque(px, lignes, col, ox, oy) { lignes.forEach((l, y) => { for (let x = 0; x < l.length; x++) if (l[x] === '1') px(col, (ox || 0) + x, (oy || 0) + y); }); }

const PAL = { capu: '#7b5cff', capuO: '#5b3fd6', capuF: '#3d2a96', capuC: '#a58fff', peau: '#e3a57a', peauO: '#c4835a', chev: '#3b1f24', jean: '#34468c', jeanF: '#26336a', chau: '#f4f1ff', semel: '#ff5d73', pc: '#cfd6e2', pcO: '#8c97aa', stick: '#ffd166', o: '#160f2a' };
const CYCLE = [[2, 4, 3, 8], [1, 4, 0, 8], [0, 4, -3, 7], [-2, 3, -5, 4], [1, 2, -1, 4], [4, 2, 5, 6]];
const BRAS = [[4, 4], [2, 5], [-1, 5], [-4, 4], [-2, 5], [1, 5]];
const BOB = [0, 1, 0, 0, 1, 0];

function jambe(px, hx, hy, k, col) {
  const kx = hx + k[0], ky = hy + k[1], fx = hx + k[2], fy = Math.min(hy + k[3], 24);
  trait(px, col, hx, hy, kx, ky); trait(px, col, kx, ky, fx, fy - 1);

function heroine(px, p) {

  const [ax, ay] = p.bras;

  jambe(px, 8, hy, p.jB, PAL.jeanF);
  px(PAL.capu, 6, 10 + b, 8, 7); px(PAL.capuO, 6, 10 + b, 2, 7); px(PAL.capuO, 7, 15 + b, 6, 1); px(PAL.capuC, 12, 10 + b, 1, 3);
  px(PAL.jean, 7, hy, 5, 2);
  jambe(px, 10, hy, p.jA, PAL.jean);
  px(PAL.capu, 6, b, 6, 1); px(PAL.capu, 5, 1 + b, 8, 1); px(PAL.capu, 4, 2 + b, 10, 7); px(PAL.capu, 5, 9 + b, 8, 1);
  px(PAL.capuO, 4, 2 + b, 2, 7); px(PAL.capuC, 7, 1 + b, 4, 1);
  px(PAL.capuF, 8, 3 + b, 6, 6); px(PAL.peau, 9, 4 + b, 5, 5); px(PAL.peau, 14, 6 + b, 1, 1);
  px(PAL.chev, 9, 3 + b, 5, 1); px(PAL.chev, 9, 4 + b, 2, 1);
  px(PAL.o, 12, 5 + b, 1, 2); px('#f28b8b', 13, 7 + b, 1, 1); px(PAL.peauO, 11, 8 + b, 2, 1);
  px(PAL.pc, 3, 11 + b, 12, 1); px(PAL.pcO, 3, 12 + b, 12, 1); px(PAL.stick, 5, 11 + b, 2, 1);
  px(PAL.capu, 9, 10 + b, 3, 3); px(PAL.capuC, 10, 10 + b, 1, 1); px(PAL.capu, 9, 13 + b, 4, 1); px(PAL.peau, 13, 13 + b, 2, 1);
}
function glissade(px) {

  px(PAL.chev, 0, 7, 2, 3);
  px(PAL.jeanF, 11, 12, 10, 2); px(PAL.chau, 21, 10, 2, 4); px(PAL.semel, 23, 10, 1, 4);
  for (let i = 0; i < 6; i++) { px(PAL.capu, 5 + i, 7 + i, 4, 3); px(PAL.capuO, 5 + i, 9 + i, 2, 1); }

  px(PAL.capu, 2, 0, 5, 1); px(PAL.capu, 1, 1, 7, 1); px(PAL.capu, 0, 2, 9, 5); px(PAL.capu, 1, 7, 7, 1); px(PAL.capuO, 0, 3, 2, 4);
  px(PAL.capuF, 4, 1, 5, 5); px(PAL.peau, 5, 2, 4, 4); px(PAL.chev, 5, 2, 4, 1); px(PAL.o, 7, 3, 1, 1); px(PAL.peauO, 8, 5, 1, 1);

function bug(px, f) {
  const L = '#2b2440';
  for (let i = 0; i < 3; i++) { const x = 5 + i * 3 + f; px(L, x, 6, 1, 2); px(L, x + (f ? -1 : 1), 8, 1, 1); }
  px('#5fd68a', 4, 1, 9, 1); px('#5fd68a', 3, 2, 11, 4); px('#2f9e5e', 3, 5, 11, 1); px('#2f9e5e', 4, 6, 9, 1);
  px('#a8f5c4', 5, 2, 3, 1); px('#a8f5c4', 4, 3, 1, 1);
  px('#1f6b40', 8, 1, 1, 6); px('#1f6b40', 6, 4, 1, 1); px('#1f6b40', 11, 3, 1, 1); px('#1f6b40', 10, 5, 1, 1);
  px('#3a2f5c', 0, 3, 4, 4); px('#3a2f5c', 1, 2, 2, 1);

function appuyer(a) {

function relacher(a) { entree[a] = false; }
const SAUT = ['Space', 'ArrowUp', 'KeyW'], GLISSE = ['ArrowDown', 'KeyS'];
window.addEventListener('keydown', e => {

  if (etat === 'titre') { if (['shift', 'control', 'alt', 'meta', 'tab', 'escape', 'p', 'capslock'].indexOf(k) < 0) demarrer(); return; }
  if (etat === 'fin' || etat === 'victoire') { if ((k === 'r' || c === 'Space' || c === 'Enter') && tEtat > 0.9) demarrer(); return; }
  if (k === 'p' || c === 'Escape') { basculerPause(); return; }
  if (enPause) { if (k === 'r') demarrer(); return; }
  if (SAUT.indexOf(c) >= 0) appuyer('saut'); else if (GLISSE.indexOf(c) >= 0) appuyer('glisse');

window.addEventListener('keyup', e => { if (SAUT.indexOf(e.code) >= 0) relacher('saut'); else if (GLISSE.indexOf(e.code) >= 0) relacher('glisse'); });

  e.preventDefault();

  if (haut || enPause) { basculerPause(); return; }

/* ---------- Boîtes de collision (un peu plus petites que les sprites) ---------- */
function boiteJoueur() {
  const j = joueur;
  if (j.glisse && j.sol) return { x: j.x - 24, y: j.y - 30, w: 54, h: 28 };
  return { x: j.x - 12, y: j.y - 68, w: 24, h: 64 };
}
function boiteObs(o) {
  if (o.type === 'bug') return { x: o.x - 18, y: GY - 20, w: 36, h: 20 };
  if (o.type === 'chaise') return { x: o.x - 18, y: GY - 54, w: 38, h: 54 };
  return { x: o.x - 42, y: o.y - 14, w: 84, h: 28 };
}
const DIM = { bas: [22, 12], haut: [22, 15], gros: [28, 25] };
function boiteProj(p) { const d = DIM[p.type]; return { x: p.x - d[0], y: p.y - d[1], w: d[0] * 2, h: d[1] * 2 }; }

/* ---------- Génération du niveau (par heure d'arrivée, pour garder des écarts justes) ---------- */
function ajouter(type, A) { const J = jeu; J.obstacles.push({ type, x: joueur.x + (J.vitesse + OBS[type].v) * (A - J.t), y: GY - 70, vit: OBS[type].v, t: Math.random() * 3 }); }
function ajouterCafe(A, y) { const J = jeu; J.cafesL.push({ x: joueur.x + J.vitesse * (A - J.t), y, t: Math.random() * 3 }); }
function tirage(poids) { let s = 0; for (const p of poids) s += p[1]; let r = Math.random() * s; for (const p of poids) { r -= p[1]; if (r <= 0) return p[0]; } return poids[0][0]; }
function planifier() {
  const J = jeu, A = J.planif, p = clamp(A / DUREE, 0, 1);
  const type = J.nPlan === 0 ? 'bug' : J.nPlan === 1 ? 'reunion' : J.nPlan === 2 ? 'chaise' : tirage([
    ['bug', 3], ['reunion', 2.6], ['chaise', 2.2], ['bugs', p > 0.3 ? 1.1 : 0], ['bugReunion', p > 0.42 ? 1.3 : 0], ['reunionBug', p > 0.55 ? 1.1 : 0], ['chaiseReunion', p > 0.7 ? 0.9 : 0]]);
  J.nPlan++;
  let duree = 0;
  const auDessus = (t, pr) => { if (Math.random() < pr) ajouterCafe(t, GY - 118); };
  if (type === 'bug') { ajouter('bug', A); auDessus(A, 0.45); }
  else if (type === 'reunion') { ajouter('reunion', A); if (Math.random() < 0.35) ajouterCafe(A, GY - 24); }
  else if (type === 'chaise') { ajouter('chaise', A); auDessus(A, 0.5); }
  else if (type === 'bugs') { ajouter('bug', A); ajouter('bug', A + 0.17); duree = 0.17; auDessus(A + 0.08, 0.6); }
  else if (type === 'bugReunion') { ajouter('bug', A); ajouter('reunion', A + 0.82); duree = 0.82; }
  else if (type === 'reunionBug') { ajouter('reunion', A); ajouter('bug', A + 0.8); duree = 0.8; }
  else { ajouter('chaise', A); ajouter('reunion', A + 0.86); duree = 0.86; }
  const ecart = lerp(1.45, 0.85, p) + Math.random() * lerp(0.6, 0.4, p);
  if (ecart > 1.05 && Math.random() < 0.5) ajouterCafe(A + duree + ecart / 2, choix([GY - 34, GY - 34, GY - 110, GY - 160]));
  J.planif = A + duree + ecart;
}

/* ---------- Mise à jour ---------- */
function maj(dt) {
  tReel += dt;
  if (enPause) return;
  tEtat += dt;
  if (etat === 'titre') majDemo(dt);
  else if (etat === 'jeu') majJeu(dt);
  else majApres(dt);
  for (const p of parts) { p.vie -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  parts = parts.filter(p => p.vie > 0);
  if (parts.length > 500) parts.splice(0, parts.length - 500);
  for (const f of flottants) { f.t += dt; f.y -= 40 * dt; }
  flottants = flottants.filter(f => f.t < 1.2);
}
function gravite(dt, vit) {
  const j = joueur;
  if (!j.sol) { j.vy += 2600 * dt; j.y += j.vy * dt; if (j.y >= GY) { j.y = GY; j.vy = 0; j.sol = true; poussiere(j.x, GY, 4); } }
  j.anim += dt * 13 * vit / 340; j.frame = Math.floor(j.anim) % 6;
  j.pose = j.sol ? 'course' : j.vy < 0 ? 'saut' : 'chute';
  j.tPoussiere -= dt;
  if (j.sol && j.tPoussiere <= 0 && vit > 0) { j.tPoussiere = 0.22; poussiere(j.x - 6, GY, 1); }
}
function majDemo(dt) {
  defile += 150 * dt;
  demo.t -= dt;
  if (demo.t <= 0) { demo.bugs.push({ x: W + 40, t: 0 }); demo.t = rnd(2.4, 3.8); }
  for (const b of demo.bugs) { b.x -= 190 * dt; b.t += dt; }
  demo.bugs = demo.bugs.filter(b => b.x > -60);
  const j = joueur;
  if (j.sol && demo.bugs.some(b => b.x - j.x > 30 && b.x - j.x < 56)) { j.vy = -740; j.sol = false; }
  gravite(dt, 200);
}
function majApres(dt) {
  const J = jeu;
  if (etat === 'victoire') {
    J.vitesse += (160 - J.vitesse) * Math.min(1, dt * 2); defile += J.vitesse * dt;
    const j = joueur; j.tHop -= dt;
    if (j.sol && j.tHop <= 0) { j.vy = -620; j.sol = false; j.tHop = rnd(0.9, 1.6); }
    gravite(dt, J.vitesse);
    if (Math.random() < 0.3) particule(rnd(0, W), -6, rnd(-40, 40), rnd(40, 120), rnd(2, 3.5), choix(CONFETTIS), choix([3, 6]), 60);
    if (J.boss) { J.boss.t += dt; if (Math.random() < 0.15) fumee(J.boss); }
  }
}
function majJeu(dt) {
  const J = jeu, j = joueur;
  J.t += dt;
  if (J.secousse > 0) J.secousse = Math.max(0, J.secousse - dt);
  if (J.invuln > 0) J.invuln -= dt;
  if (J.banniere && (J.banniere.t += dt) > J.banniere.d) J.banniere = null;
  if (J.indice && (J.indice.t += dt) > J.indice.d) J.indice = null;
  if (J.phase === 'course') {
    J.minutes = Math.min(30, J.t / DUREE * 30);
    if (J.minutes >= 15 && J.quart === 0) { J.quart = 1; banniere('17 h 45', 'On accélère !', true); Son.quart(); }
    J.cible = J.quart === 0 ? lerp(330, 360, J.minutes / 15) : lerp(405, 440, (J.minutes - 15) / 15);
    if (J.t >= DUREE) debutBoss();
    else if (!J.mort) while (J.planif < Math.min(J.t + 2.8, DUREE - 1.6)) planifier();
  }
  if (J.mort) J.cible = 0;
  J.vitesse += (J.cible - J.vitesse) * Math.min(1, dt * (J.mort ? 3 : 2));
  const v = J.vitesse;
  defile += v * dt;
  if (!J.mort && J.phase === 'course') J.score += v * dt / 10;
  if (J.cafeine > 0 && (J.cafeine -= dt) <= 0) { J.cafeine = 0; flottant(j.x, j.y - 110, 'Fin du double saut', '#b9a8ff'); }
  majJoueur(dt);
  const bj = boiteJoueur();
  for (const o of J.obstacles) {
    o.x -= (v + o.vit) * dt; o.t += dt;
    if (o.type === 'reunion') o.y = GY - 70 + Math.sin(o.t * 5) * 4;
    if (!o.vu && o.x < W - 20) { o.vu = true; astuce(o.type); }
    if (!J.mort && J.invuln <= 0 && chevauche(bj, boiteObs(o))) toucher(o.type);
  }
  J.obstacles = J.obstacles.filter(o => o.x > -120);
  for (const c of J.cafesL) {
    c.x -= v * dt; c.t += dt;
    if (!J.astuces.cafe && c.x < W - 20 && !J.indice && J.nPlan > 3) astuce('cafe');
    if (!J.mort && chevauche(bj, { x: c.x - 18, y: c.y - 21, w: 36, h: 42 })) prendreCafe(c);
  }
  J.cafesL = J.cafesL.filter(c => c.x > -60 && !c.pris);
  if (J.boss) majBoss(dt);
  for (const p of J.projectiles) {
    p.x -= p.vit * dt; p.t += dt;
    if (Math.random() < 0.5) particule(p.x + 26, p.y + rnd(-8, 8), rnd(40, 120), rnd(-30, 30), 0.3, choix(['#ff8c42', '#ff3b5c', '#ffd166']), 3, 0);
    if (!J.mort && J.invuln <= 0 && chevauche(bj, boiteProj(p))) { p.mort = true; etincelles(p.x, p.y, 14, ['#ff3b5c', '#ffd166', '#ffffff']); toucher('erreur'); }
  }
  J.projectiles = J.projectiles.filter(p => p.x > -80 && !p.mort);
  if (J.bouton) majBouton(dt);
  else if (J.tBouton > 0 && (J.tBouton -= dt) <= 0) creerBouton();
  if (J.mort && (J.tMort += dt) > 1.7) finPartie(false);
}
function majJoueur(dt) {
  const j = joueur, J = jeu;
  j.yPrec = j.y;
  if (J.mort) {
    if (!j.sol) { j.vy += 2400 * dt; j.y += j.vy * dt; if (j.y >= GY) { j.y = GY; j.vy = 0; j.sol = true; poussiere(j.x, GY, 10); J.secousse = 0.2; } }
    j.pose = j.sol ? 'ko' : 'chute'; return;
  }
  if (j.tampon > 0) {
    j.tampon -= dt;
    if (j.sol) sauter(820, false);
    else if (J.cafeine > 0 && !j.double) sauter(760, true);
  }
  if (j.sol) {
    if (entree.glisse && !j.glisse) { j.glisse = true; j.tGlisse = 0; Son.glisse(); poussiere(j.x + 10, GY, 4); }
    if (j.glisse && (j.tGlisse += dt) > 0.35 && !entree.glisse) j.glisse = false;
  } else {
    if (entree.glisse && !j.plonge) { j.plonge = true; if (j.vy < 650) j.vy = 650; }
    const tient = entree.saut && j.vy < 0 && j.tMaintien < 0.2;
    if (tient) j.tMaintien += dt;
    j.vy = Math.min(1400, j.vy + (tient ? 1400 : entree.glisse ? 4000 : 2800) * dt);
    j.y += j.vy * dt;
    if (j.y >= GY) { j.y = GY; j.vy = 0; j.sol = true; j.double = false; j.plonge = false; poussiere(j.x, GY, 6); }
  }
  if (j.tour > 0) j.tour = Math.max(0, j.tour - dt);
  j.anim += dt * 13 * J.vitesse / 340; j.frame = Math.floor(j.anim) % 6;
  j.pose = !j.sol ? (j.vy < 0 ? 'saut' : 'chute') : j.glisse ? 'glisse' : 'course';
  j.tPoussiere -= dt;
  if (j.sol && j.tPoussiere <= 0) {
    if (j.glisse) { j.tPoussiere = 0.04; particule(j.x + 36, GY - 4, rnd(-40, 80), rnd(-160, -60), 0.3, choix(['#ffd166', '#ff8c42']), 3, 900); }
    else { j.tPoussiere = 0.2; poussiere(j.x - 6, GY, 1); }

  if (J.cafeine > 0) { if ((j.tTrace -= dt) <= 0) { j.tTrace = 0.05; j.traces.unshift({ y: j.y, pose: j.pose, frame: j.frame }); if (j.traces.length > 3) j.traces.pop(); } }
  else j.traces.length = 0;
}
function sauter(v, double) {
  const j = joueur;
  j.vy = -v; j.sol = false; j.glisse = false; j.tMaintien = 0; j.tampon = 0; j.plonge = false;
  if (double) { j.double = true; j.tour = 0.4; Son.doubleSaut(); etincelles(j.x, j.y - 10, 10, ['#ffd166', '#fff3b0', '#c98a4b']); }
  else { Son.saut(); poussiere(j.x, GY, 5); }
}
function astuce(type) {
  const J = jeu;
  if (J.astuces[type]) return;
  J.astuces[type] = true;
  const s = {
    bug: tactile ? 'Bug en vue : touchez à droite pour sauter' : 'Bug en vue : Espace ou ↑ pour sauter',
    reunion: tactile ? 'Invitation ! Touchez à gauche pour glisser dessous' : 'Invitation ! ↓ pour glisser dessous',
    chaise: 'Chaise lancée à pleine vitesse : sautez !',

}
function toucher(cause) {

  J.vies--; J.cause = cause; J.secousse = 0.35; Son.aie();
  etincelles(j.x, j.y - 40, 12, ['#ff5d73', '#ffd166', '#ffffff']);
  j.glisse = false;
  if (J.vies <= 0) { J.mort = true; J.tMort = 0; j.vy = -520; j.sol = false; Son.arreterMusique(); }
  else { J.invuln = 1.6; flottant(j.x, j.y - 100, '−1 cœur', '#ff8fab'); if (j.sol) { j.vy = -380; j.sol = false; j.tMaintien = 1; } }

  if (J.cafes >= 5) { J.cafes = 0; J.cafeine = 5; Son.cafeine(); flottant(joueur.x, joueur.y - 110, 'Double saut : 5 s !', '#ffd166'); }

function finPartie(gagne) {

/* ---------- Combat final : « La Prod » ---------- */
function debutBoss() {
  const J = jeu;
  J.phase = 'boss'; J.minutes = 30; J.cible = 430; J.tBoss = J.t;
  J.boss = { x: W + 200, cx: 790, etat: 'entree', t: 0, vague: 0, restants: 0, tir: 0, bouche: 0, recul: 0, yeux: 'colere', flamme: 1, annonce: false, bulle: { s: '« Vous partiez en week-end ? »', t: 0, d: 2.8 } };
  banniere('18 h 00', 'La Prod est en feu !', true);
  Son.quart(); Son.boom(); Son.lancerMusique(1); J.secousse = 0.3;
}
function lancerVague(i) {
  const B = jeu.boss, V = VAGUES[i];
  Object.assign(B, { etat: 'vague', vague: i, restants: V.n, tir: 1, t: 0, yeux: 'colere', bulle: { s: V.cri, t: 0, d: 2.2 } });
  banniere('Vague ' + (i + 1) + '/3', i === 2 ? 'La dernière, promis.' : 'Sautez ou glissez !', false);
}
function tirer(B, V) {
  let type = choix(V.types);
  if (type === 'gros' && B.dernier === 'gros') type = 'bas';
  B.dernier = type;
  jeu.projectiles.push({ type, x: B.x - 60, y: type === 'haut' ? GY - 73 : type === 'gros' ? GY - 27 : GY - 15, vit: V.vit, t: 0 });
  B.bouche = 0.25; B.recul = 1; Son.tir();
}
function flammeParticule(B) { particule(B.x + rnd(-62, 62), GY - 196 - rnd(0, 30), rnd(-30, 30), rnd(-170, -60), rnd(0.4, 0.8), choix(['#ffd166', '#ff8c42', '#ff3b3b']), 3, -40); }
function fumee(B) { particule(B.x + rnd(-50, 50), GY - 196, rnd(-20, 20), rnd(-70, -30), rnd(1, 1.6), choix(['#5b5670', '#7a7590', '#4a4560']), 6, -10); }
function majBoss(dt) {
  const J = jeu, B = J.boss;
  B.t += dt; B.x += (B.cx - B.x) * Math.min(1, dt * 2.5);
  if (B.bouche > 0) B.bouche -= dt;
  if (B.recul > 0) B.recul -= dt * 4;
  if (B.bulle && (B.bulle.t += dt) > B.bulle.d) B.bulle = null;
  if (B.flamme > 0 && Math.random() < 0.6 * B.flamme) flammeParticule(B);
  if (B.etat === 'deploye' && Math.random() < 0.2) fumee(B);
  if (J.mort) return;
  if (B.etat === 'entree' && B.t > 3) lancerVague(0);
  else if (B.etat === 'vague') {
    const V = VAGUES[B.vague];
    B.tir -= dt;
    if (B.restants > 0 && B.tir <= 0) { tirer(B, V); B.restants--; B.tir = V.iv * rnd(0.95, 1.2); }
    if (B.restants === 0 && J.projectiles.length === 0) {
      J.score += 250; flottant(joueur.x, GY - 130, '+250', '#7cf2b0'); B.yeux = 'etourdi'; B.t = 0; Son.boom(); J.secousse = 0.2;
      if (B.vague < 2) { B.etat = 'repos'; banniere('Vague ' + (B.vague + 1) + '/3 esquivée', choix(['La Prod vacille.', 'La Prod tousse un peu de fumée.']), false); }
      else { B.etat = 'sonne'; B.bulle = { s: '« Bon… d’accord… déployez. »', t: 0, d: 3.2 }; J.cible = 300; }
    }
  } else if (B.etat === 'repos' && B.t > 1.9) lancerVague(B.vague + 1);
  else if (B.etat === 'sonne' && B.t > 1.4 && !J.bouton && !(J.tBouton > 0)) {
    creerBouton();
    if (!B.annonce) { B.annonce = true; banniere('Dernière étape', 'Sautez sur le bouton « Déployer » !', false); }
  } else if (B.etat === 'deploye') { B.flamme = Math.max(0, B.flamme - dt); if (B.t > 3.4) finPartie(true); }
}
function minutesAffichees() { const J = jeu; return J.phase === 'boss' ? 30 + Math.min(9, Math.floor(((J.tFin || J.t) - J.tBoss) / 5)) : J.minutes; }
function creerBouton() { jeu.bouton = { x: W + 70, presse: false, t: 0 }; jeu.tBouton = 0; }
function majBouton(dt) {
  const J = jeu, b = J.bouton, j = joueur;
  b.x -= J.vitesse * dt; b.t += dt;
  if (!b.presse) {
    const haut = GY - 42;
    if (!j.sol && j.vy > 0 && j.y >= haut && j.yPrec <= haut + 12 && Math.abs(j.x - b.x) < 48) {
      b.presse = true; j.y = haut; j.vy = -720; j.tMaintien = 1; j.double = false; deployer();
    } else if (b.x < j.x - 70) { J.bouton = null; J.tBouton = 1.1; Son.rate(); flottant(j.x + 80, GY - 140, 'Raté ! Le bouton revient.', '#ffd166'); }
  } else if (b.x < -100) J.bouton = null;
}
function deployer() {
  const J = jeu, B = J.boss;
  Object.assign(B, { etat: 'deploye', t: 0, yeux: 'calme', bulle: { s: '« 200 OK. » Bon week-end !', t: 0, d: 3.6 } });
  Son.arreterMusique(); Son.victoire(); J.secousse = 0.25; J.score += 1500 + J.vies * 500; J.cible = 220;
  J.tFin = J.t; J.heureFin = heure(minutesAffichees());
  etincelles(J.bouton.x, GY - 40, 24, ['#7cf2b0', '#ffffff', '#ffd166']);
  for (let i = 0; i < 90; i++) particule(rnd(60, 900), rnd(-60, 20), rnd(-80, 80), rnd(0, 140), rnd(1.6, 3.2), choix(CONFETTIS), choix([3, 6]), 150);

/* ---------- Rendu ---------- */
function tuile(img, off, y) { const w = img.width; let x = -(Math.floor(off) % w); for (; x < W; x += w) ctx.drawImage(img, x, y); }
function disque(cx, cy, r, c) { ctx.fillStyle = c; for (let dy = -r; dy < r; dy += 3) { const m = dy + 1.5, hw = Math.floor(Math.sqrt(Math.max(0, r * r - m * m)) / 3) * 3; ctx.fillRect(cx - hw, cy + dy, hw * 2, 3); } }

  ctx.fillStyle = gr; ctx.fillRect(0, 48, W, 270);

  disque(650, sy, 60, 'rgba(255,214,150,0.25)'); disque(650, sy, 42, melange('#ffe7a0', '#ffb36b', k));
  ctx.globalAlpha = 1 - k * 0.45; tuile(IMG.nuages, defile * 0.03 + tReel * 5, 62); ctx.globalAlpha = 1;
  tuile(IMG.villeLoin, defile * 0.06, 110);
