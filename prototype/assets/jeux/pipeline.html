const CAUSE = {

let best = 0, CWT = 11;
const P = {};

function mkTodo(x, n) { const r = []; for (let i = 0; i < n; i++) r.push(rnd(-0.07, 0.07)); return { t: 'todo', x, w: 4 * cw(18), yb: 0, h: n * 18 - 3, n, ix: 3, rot: r, ph: rnd(0, 6) }; }

function wpick(w) { let s = 0; for (const k in w) s += w[k]; let r = Math.random() * s; for (const k in w) { r -= w[k]; if (r <= 0) return k; } return Object.keys(w)[0]; }
